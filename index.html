<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Caderno Financeiro</title>
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caderno">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <button id="menuBtn" class="icon-btn" aria-label="Configurações">⚙️</button>
    <h1 class="app-title">📒 Caderno Financeiro</h1>
    <span class="icon-btn spacer" aria-hidden="true"></span>
  </div>
  <div class="summary">
    <div class="summary-item">
      <span class="summary-label">Saldo total acumulado</span>
      <span class="summary-value" id="totalBalance">R$ 0,00</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-item">
      <span class="summary-label">Balanço de hoje</span>
      <span class="summary-value" id="todayBalance">R$ 0,00</span>
    </div>
  </div>
</header>

<main id="notebook" class="notebook"></main>

<nav id="dayNav" class="day-nav">
  <button type="button" id="prevDayBtn" class="day-nav-btn" aria-label="Dia anterior">‹ Dia anterior</button>
  <button type="button" id="nextDayBtn" class="day-nav-btn" aria-label="Dia seguinte">Dia seguinte ›</button>
</nav>

<button id="fabAdd" class="fab" aria-label="Adicionar lançamento">+</button>

<div id="overlay" class="overlay hidden"></div>

<section id="entrySheet" class="sheet hidden" aria-hidden="true">
  <div class="sheet-handle"></div>
  <h2 id="entrySheetTitle" class="sheet-title">Novo lançamento</h2>
  <form id="entryForm">
    <div class="type-toggle">
      <button type="button" class="type-btn type-in active" data-type="in">+ Entrada</button>
      <button type="button" class="type-btn type-out" data-type="out">− Saída</button>
    </div>

    <label class="field">
      <span class="field-label">Valor (R$)</span>
      <input id="entryValue" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
    </label>

    <label class="field">
      <span class="field-label">Descrição</span>
      <input id="entryDescription" type="text" placeholder="Ex: Venda, Ingredientes, Uber..." autocomplete="off" required>
    </label>

    <label class="field">
      <span class="field-label">Tag (opcional)</span>
      <input id="entryTag" type="text" placeholder="Ex: Pix, Dinheiro, Cartão" autocomplete="off" maxlength="12">
    </label>

    <div class="sheet-actions">
      <button type="button" id="entryDeleteBtn" class="btn btn-danger hidden">Excluir</button>
      <button type="button" id="entryCancelBtn" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</section>

<section id="settingsSheet" class="sheet hidden" aria-hidden="true">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title">Configurações</h2>

  <label class="field">
    <span class="field-label">Saldo inicial (antes de começar a anotar)</span>
    <input id="initialBalanceInput" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
  </label>
  <div class="sheet-actions">
    <button type="button" id="saveInitialBalanceBtn" class="btn btn-primary btn-block">Salvar saldo inicial</button>
  </div>

  <hr class="sheet-sep">

  <p class="field-label">Backup dos dados</p>
  <div class="sheet-actions">
    <button type="button" id="exportBtn" class="btn btn-ghost btn-block">Exportar (.json)</button>
    <button type="button" id="importBtn" class="btn btn-ghost btn-block">Importar (.json)</button>
  </div>
  <input type="file" id="importFile" accept="application/json" hidden>

  <hr class="sheet-sep">

  <div class="sheet-actions">
    <button type="button" id="clearAllBtn" class="btn btn-danger btn-block">Apagar todos os dados</button>
  </div>
  <div class="sheet-actions">
    <button type="button" id="settingsCloseBtn" class="btn btn-ghost btn-block">Fechar</button>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
